name: Generate Signing Keystore (run once)

# ===========================================================================
#  Creates your Android code-signing certificate WITHOUT any software on your
#  computer. You need this exactly ONCE in the app's lifetime.
#
#  HOW TO RUN
#    Actions tab -> "Generate Signing Keystore (run once)" -> Run workflow
#
#  WHAT IT PRODUCES (Artifacts box at the bottom of the run page)
#    pothik-keystore-info.txt   <- passwords + base64 text. DO NOT SHARE.
#    pothik-release.jks         <- the certificate. KEEP A SAFE BACKUP.
#
#  THEN  paste the four values into
#        Settings -> Secrets and variables -> Actions -> New repository secret
#          KEYSTORE_BASE64     =  (the long base64 line)
#          KEYSTORE_PASSWORD   =  (storePassword from the info file)
#          KEY_ALIAS           =  (keyAlias  from the info file)
#          KEY_PASSWORD        =  (keyPassword from the info file)
#
#  ⚠️  IMPORTANT
#    * Lose this file and you can NEVER update your app under the same
#      identity again. Download it and keep 2 copies.
#    * A self-signed certificate proves the app is consistently from you and
#      lets it update itself. It does NOT remove Android's "install from
#      unknown sources" warning — only publishing on Google Play does that.
#    * If you enrol in Google Play App Signing, Google holds the real signing
#      key and this one becomes your *upload* key. That is the normal path.
# ===========================================================================

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key alias (name of the key inside the store)'
        required: true
        default: 'pothik'
      validity_years:
        description: 'Validity in years (25+ recommended; Play requires 2033+)'
        required: true
        default: '30'
      organisation:
        description: 'Organisation name (shown inside the certificate)'
        required: true
        default: 'Pothik'

permissions:
  contents: read

jobs:
  keystore:
    name: Build keystore
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        id: gen
        env:
          ALIAS: ${{ github.event.inputs.alias }}
          YEARS: ${{ github.event.inputs.validity_years }}
          ORG: ${{ github.event.inputs.organisation }}
        run: |
          set -euo pipefail

          # Strong random passwords, no shell-special characters.
          STORE_PW=$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)
          KEY_PW=$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)
          DAYS=$(( YEARS * 365 ))

          keytool -genkeypair \
            -keystore pothik-release.jks \
            -storetype PKCS12 \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 4096 \
            -validity "$DAYS" \
            -storepass "$STORE_PW" \
            -keypass "$KEY_PW" \
            -dname "CN=$ORG, OU=Mobile, O=$ORG, L=Dhaka, ST=Dhaka, C=BD"

          base64 -w 0 pothik-release.jks > pothik-keystore-base64.txt

          {
            echo "=============================================================="
            echo " POTHIK — ANDROID SIGNING KEY  (keep this private!)"
            echo "=============================================================="
            echo ""
            echo "Generated : $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "Valid for : $YEARS years ($DAYS days)"
            echo "Type      : PKCS12 (works with apksigner and Gradle)"
            echo ""
            echo "--- Put these four into GitHub secrets ------------------------"
            echo ""
            echo "KEY_ALIAS          = $ALIAS"
            echo "KEYSTORE_PASSWORD  = $STORE_PW"
            echo "KEY_PASSWORD       = $KEY_PW"
            echo ""
            echo "KEYSTORE_BASE64    = the contents of pothik-keystore-base64.txt"
            echo "                     (one very long line, copy ALL of it)"
            echo ""
            echo "--- Certificate details ---------------------------------------"
            echo ""
            keytool -list -v -keystore pothik-release.jks -storepass "$STORE_PW" \
              | grep -E 'Alias|Valid|Owner|Issuer|SHA1|SHA256|Signature algorithm' || true
            echo ""
            echo "--- Backup instructions ---------------------------------------"
            echo ""
            echo "1. Download BOTH artifact files from this workflow run."
            echo "2. Store them in 2 separate safe places (cloud drive + USB)."
            echo "3. Never commit them to your repository."
            echo "4. If you lose them you cannot update the app under the same"
            echo "   identity on Google Play ever again."
            echo ""
            echo "=============================================================="
          } > pothik-keystore-info.txt

          cat pothik-keystore-info.txt

          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"

      - name: Write summary
        run: |
          {
            echo "## Keystore created ✅"
            echo ""
            echo "Download the two files from **Artifacts** below."
            echo "Open \`pothik-keystore-info.txt\` — it contains the four values"
            echo "you must paste into repository secrets."
            echo ""
            echo "**Back the .jks file up in two places right now.**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: pothik-keystore-DO-NOT-SHARE
          path: |
            pothik-release.jks
            pothik-keystore-base64.txt
            pothik-keystore-info.txt
          retention-days: 90
          if-no-files-found: error
